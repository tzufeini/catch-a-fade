# Render blueprint — deploys the Catch a Fade prototype as a free web service.
# In the Render dashboard: New + → Blueprint → pick this repo → it reads this file.
# You'll be prompted to paste the two secret keys (they live only on Render, never in git).
services:
  - type: web
    name: catch-a-fade
    runtime: node
    plan: free
    buildCommand: "npm install"
    startCommand: node server.js
    autoDeploy: true
    envVars:
      - key: RESEND_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: PLATFORM_FEE_PERCENT
        value: "25"
      # App Review demo login (not secret — goes in App Store Connect review notes)
      - key: REVIEW_EMAIL
        value: "review@catchafade.app"
      - key: REVIEW_CODE
        value: "010101"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
